<header><div class="eyebrow">CONFIRM</div><h1>{{ confirmation_title }}</h1><p class="muted">请核对操作对象和影响范围。</p></header><section class="surface"><h2>{{ target_display }}</h2><p class="muted">{{ confirmation_text }}</p><form method="post" action="{{ action_url }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="confirm_target" value="{{ confirmation_id }}">{% for key,value in extra_fields.items() %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<div class="actions"><button class="primary">确认操作</button><a class="button secondary" href="{{ back_url }}">返回</a></div></form></section>
