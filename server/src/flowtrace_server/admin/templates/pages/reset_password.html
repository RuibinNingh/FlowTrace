<header><div class="eyebrow">CREDENTIALS</div><h1>重置用户密码</h1><p class="muted">{{ target.username }} · <span class="mono">{{ target.id }}</span></p></header>
<section class="surface"><h2>核对目标与影响</h2><p class="muted">新密码会替换该账号的旧密码，并撤销全部客户端和后台会话；不会启用已禁用的账号，也不会改动账本资料。新密码只在本次输入，不会回显或写入审计。</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<form class="credential-form" method="post" action="/admin/users/{{ target.id }}/password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>当前管理密码<input name="current_password" type="password" autocomplete="current-password" minlength="12" maxlength="256" required></label><label>用户新密码<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>再次输入用户新密码<input name="repeat_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label class="checkbox"><input name="confirm_target" type="checkbox" value="{{ target.id }}" required>确认重置 {{ target.username }}，并撤销其全部会话</label><div class="actions"><button class="primary">确认重置密码</button><a class="button secondary" href="/admin/users">返回用户</a></div></form></section>
