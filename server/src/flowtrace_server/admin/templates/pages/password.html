<header><div class="eyebrow">SECURITY</div><h1>修改管理凭据</h1><p class="muted">修改后会撤销其他设备的会话，保留当前管理会话。</p></header><section class="surface">{% if changed %}<div class="notice" role="status">密码已更新，其他设备会话已撤销。</div>{% endif %}<form class="credential-form" method="post" action="/admin/password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>当前密码<input name="current_password" type="password" autocomplete="current-password" minlength="12" maxlength="256" required></label><label>新密码<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>再次输入新密码<input name="repeat_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button class="primary">更新密码</button></form></section>
