<header><div class="eyebrow">DEVICES</div><h1>{{ target.username }} 的会话</h1><p class="muted">撤销会话后，该设备下次访问会重新登录。</p></header><section class="surface table-wrap"><table><thead><tr><th>设备</th><th>用途</th><th>到期时间</th><th>操作</th></tr></thead><tbody>{% for item in sessions %}<tr><td class="weight">{{ item.device_name }}</td><td>{{ '后台管理' if item.purpose=='admin' else '记账客户端' }}</td><td>{{ item.expires_at|utc_time }}</td><td>{% if item.revoked_at %}<span class="badge off">已撤销</span>{% else %}<form method="post" action="/admin/sessions/{{ item.id }}/revoke"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="text-link">撤销会话</button></form>{% endif %}</td></tr>{% else %}<tr><td colspan="4" class="empty">暂无会话。</td></tr>{% endfor %}</tbody></table></section>
