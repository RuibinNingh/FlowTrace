[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "flowtrace-server"
version = "0.1.0"
description = "Independent Python service for FlowTrace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "jinja2>=3.1,<4",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.2",
  "pillow>=13,<14",
  "portalocker>=4,<5",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2", "hatchling>=1.27,<2", "editables>=0.5,<1", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/flowtrace_server"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "flowtrace_server/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires an explicitly isolated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
