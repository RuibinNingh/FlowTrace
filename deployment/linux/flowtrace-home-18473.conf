server {
    listen 192.168.0.145:18473 ssl;
    server_name home.ruibin-ningh.top;
    ssl_certificate /www/server/panel/vhost/letsencrypt/home.ruibin-ningh.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/home.ruibin-ningh.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != home.ruibin-ningh.top) { return 444; }
    root /www/wwwroot/flowtrace/current;
    index index.html;
    client_max_body_size 64m;
    access_log off;
    error_log /www/wwwlogs/flowtrace.error.log warn;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-store always;
    location /api/ { include /etc/flowtrace/nginx-proxy.inc; }
    location /admin/ { include /etc/flowtrace/nginx-proxy.inc; }
    location = /admin { return 302 /admin/login; }
    location /health/ { include /etc/flowtrace/nginx-proxy.inc; }
    location /downloads/ {
        alias /www/wwwroot/flowtrace/downloads/;
        autoindex off;
        default_type application/octet-stream;
        types {
            application/zip zip;
            application/vnd.android.package-archive apk;
            application/json json;
            text/plain txt;
        }
    }
    location ~ /\. { return 404; }
    location ~ \.wasm$ { types { application/wasm wasm; } try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
