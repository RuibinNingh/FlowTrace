name: flowtrace
description: 流迹：独立部署、离线优先的跨平台记账客户端。
publish_to: none
version: 0.1.1+2

environment:
  sdk: '>=3.10.1 <4.0.0'
  flutter: '>=3.38.3'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: 4.0.7
  crypto: 3.0.7
  cryptography: 2.9.0
  drift: 2.34.4
  file_selector: 1.1.0
  flutter_secure_storage: 10.3.4
  http: 1.6.0
  path: 1.9.1
  path_provider: 2.1.6
  # Keep the channel-based implementation compatible with the installed SDK.
  path_provider_android: 2.2.21
  sqlite3: 3.5.2
  timezone: 0.11.2
  uuid: 4.6.0
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: 2.15.0
  drift_dev: 2.34.0
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE/OFL.txt
    - assets/fonts/LICENSE/Roboto.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
    - family: NotoSansCJKSC
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
